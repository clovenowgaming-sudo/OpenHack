name: Build OpenHack-2.7

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          sdk: v5.11.2
          target: ${{ matrix.config.target }}

  package:
    name: Package .geode
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge build artifacts
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenHack-2.7
          path: ${{ steps.build.outputs.build-output }}
